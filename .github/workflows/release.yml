# Builds the downloadable binaries and attaches them to a GitHub Release.
#
# Run it from the Actions tab (Run workflow), or push a v* tag. The APK is also
# committed at dist/TRexRunner.apk so it can be grabbed without waiting for CI;
# the desktop bundles are far too big for git and only exist as release assets.
name: Build release binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'
  # Build (but don't publish) on pull requests, so a change that breaks either
  # build is caught before it lands rather than at release time.
  pull_request:
    branches: [main]

permissions:
  contents: write

# A newer push supersedes an in-flight build of the same ref. Releases are
# never cancelled mid-publish, only pull-request builds.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Stage the APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/TRexRunner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/TRexRunner.apk

  desktop:
    name: Desktop bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The Windows icon is patched in with resedit (pure JS), so cross-building
      # from Linux needs no wine and one runner covers both targets.
      - name: Build Windows and Linux bundles
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          node build.js

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-bundles
          path: desktop/build/dist/*.zip

  release:
    name: Publish release
    needs: [android, desktop]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact directories
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.apk' -o -name '*.zip' \) -exec cp {} release/ \;
          ls -la release

      # gh is preinstalled on the runner, so publishing needs no third-party
      # action - one less thing that can be unavailable or break.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          cat > notes.md <<'NOTES'
          Pre-built and ready to run. Nothing to compile, and no internet needed
          once downloaded.

          | Download | Platform | How to run it |
          |---|---|---|
          | `TRexRunner.apk` | Android 5.0+ | Copy to the phone and tap it. Signed, no permissions, ~38 KB. |
          | `TRexRunner-windows-x64.zip` | Windows 10/11 x64 | Unzip, run `TRexRunner.exe`. Portable - no installer, no admin rights. |
          | `TRexRunner-linux-x64.zip` | Linux x64 | Unzip, run `./TRexRunner`. |

          Windows shows a SmartScreen warning the first time because the binary
          has no paid code-signing certificate: *More info -> Run anyway*.

          Prefer no download at all? `index.html` in the repo is the whole game -
          open it in any browser, online or off.
          NOTES

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing its assets."
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "T-Rex Runner $TAG" \
              --notes-file notes.md
          fi

          echo "Published:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "  \(.name)  \(.size) bytes"'
