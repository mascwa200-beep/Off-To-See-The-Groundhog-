# Builds the downloadable binaries and attaches them to a GitHub Release.
#
# Run it from the Actions tab (Run workflow), or push a v* tag. The APK is also
# committed at dist/TRexRunner.apk so it can be grabbed without waiting for CI;
# the desktop bundles are far too big for git and only exist as release assets.
name: Build release binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'
  # Build (but don't publish) on pull requests, so a change that breaks either
  # build is caught before it lands rather than at release time.
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Stage the APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/TRexRunner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/TRexRunner.apk

  desktop:
    name: Desktop bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The Windows icon is patched in with resedit (pure JS), so cross-building
      # from Linux needs no wine and one runner covers both targets.
      - name: Build Windows and Linux bundles
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          node build.js

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-bundles
          path: desktop/build/dist/*.zip

  release:
    name: Publish release
    needs: [android, desktop]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact directories
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.apk' -o -name '*.zip' \) -exec cp {} release/ \;
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: T-Rex Runner ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: false
          body: |
            Pre-built, ready to run. Nothing to compile, no internet needed once downloaded.

            | Download | Platform | Notes |
            |---|---|---|
            | `TRexRunner.apk` | Android 5.0+ | Side-load it. Signed, no permissions, ~38 KB. |
            | `TRexRunner-windows-x64.zip` | Windows 10/11 x64 | Unzip, run `TRexRunner.exe`. Portable, no installer. |
            | `TRexRunner-linux-x64.zip` | Linux x64 | Unzip, run `./TRexRunner`. |

            Prefer no download at all? `index.html` in the repo is the whole game —
            open it in any browser, online or off.
          files: release/*
          fail_on_unmatched_files: true
