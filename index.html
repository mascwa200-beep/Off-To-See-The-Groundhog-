<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Offline T-Rex runner. Works with no internet, on PC and Android.">
<title>T-Rex Runner</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #fff;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    -webkit-touch-callout: none;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
  }

  /* Everything that inverts at night lives inside this wrapper, exactly like
     Chrome inverts the whole page when night mode kicks in. */
  #page {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
    filter: invert(0);
    transition: filter 1s ease-in-out;
  }

  #page.inverted {
    filter: invert(1);
  }

  #wrapper {
    position: relative;
    display: block;
    overflow: hidden;
  }

  #runner {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    -ms-interpolation-mode: nearest-neighbor;
  }

  #hint {
    color: #535353;
    font-size: 13px;
    line-height: 1.5;
    text-align: center;
    margin-top: 14px;
    letter-spacing: .2px;
    opacity: 1;
    transition: opacity .4s linear;
  }

  #hint.hidden {
    opacity: 0;
  }

  #hint b {
    font-weight: 600;
  }

  /* Small mute affordance. Sits out of the way, still inverts with the page. */
  #mute {
    position: fixed;
    top: calc(8px + env(safe-area-inset-top));
    right: calc(8px + env(safe-area-inset-right));
    width: 40px;
    height: 40px;
    border: 0;
    background: transparent;
    color: #535353;
    font-size: 18px;
    line-height: 40px;
    padding: 0;
    cursor: pointer;
    opacity: .55;
    touch-action: manipulation;
  }

  #mute:hover { opacity: 1; }
</style>
</head>
<body>
<div id="page">
  <div id="wrapper">
    <canvas id="runner" width="600" height="150"></canvas>
  </div>
  <div id="hint">
    <span class="desktop-hint"><b>Space</b> or <b>&uarr;</b> to jump &nbsp;&middot;&nbsp; <b>&darr;</b> to duck</span>
  </div>
</div>
<button id="mute" type="button" title="Mute (M)" aria-label="Mute">&#9835;</button>

//==============================================================================
// ATLAS
// Every sprite gets painted once into one offscreen canvas at boot, then blitted
// with drawImage - same shape as the original's single sprite sheet.
//==============================================================================

var SPRITE_COLOR = '#535353';

var atlas = document.createElement('canvas');
var atlasCtx = atlas.getContext('2d');
var SPRITES = {};

/** Deterministic PRNG so the horizon and stars look the same on every load. */
function seededRandom(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function artWidth(rows) {
  var w = 0;
  for (var i = 0; i < rows.length; i++) {
    if (rows[i].length > w) w = rows[i].length;
  }
  return w;
}

/** Paints '#' cells of a string-array sprite into ctx at (x, y). */
function paintArt(ctx, rows, x, y) {
  ctx.fillStyle = SPRITE_COLOR;
  for (var r = 0; r < rows.length; r++) {
    var row = rows[r];
    var runStart = -1;
    for (var c = 0; c <= row.length; c++) {
      var on = row.charAt(c) === '#';
      if (on && runStart === -1) {
        runStart = c;
      } else if (!on && runStart !== -1) {
        ctx.fillRect(x + runStart, y + r, c - runStart, 1);
        runStart = -1;
      }
    }
  }
}

/** Paints the horizon strip: a solid line plus bumps and scattered pebbles. */
function paintHorizon(ctx, x, y, width, bumpy, seed) {
  var rand = seededRandom(seed);
  ctx.fillStyle = SPRITE_COLOR;
  // The ground surface itself: 2px, in segments so bumps can raise a stretch
  // of it by a pixel. Row 1 of the strip is where the dino's feet land.
  var cursor = 0;
  while (cursor < width) {
    var segment = Math.floor(20 + rand() * 60);
    if (cursor + segment > width) segment = width - cursor;
    var lift = (bumpy && rand() < 0.45) ? -1 : 0;
    ctx.fillRect(x + cursor, y + 1 + lift, segment, 2);
    // Close the vertical step where a bump starts.
    if (lift) ctx.fillRect(x + cursor, y, 1, 3);
    cursor += segment;
  }
  // Pebbles and tufts scattered on the ground below the line.
  var pebbles = bumpy ? 90 : 55;
  for (var i = 0; i < pebbles; i++) {
    var px = x + Math.floor(rand() * width);
    var py = y + 4 + Math.floor(rand() * 7);
    var pw = 1 + Math.floor(rand() * 3);
    ctx.fillRect(px, py, pw, 1);
    if (rand() < 0.25) ctx.fillRect(px + pw, py - 1, 1, 1);
  }
}

/**
 * Paints one moon phase. The moon is a 40px disc; a phase is that disc with an
 * offset disc cut out of it, then cropped to the 20px-wide slice the original
 * shows for everything but the full moon.
 */
function paintMoon(ctx, x, y, phase) {
  var R = 20;
  var full = phase === 3;
  var w = full ? 40 : 20;
  // How far the shadow disc sits from the moon's centre. 0 would swallow the
  // whole moon, 40 leaves it untouched.
  // Bigger magnitude = fatter crescent. Waxing phases are lit down the left
  // side of the disc and waning down the right, so each crops its own half.
  var offsets = [8, 14, 20, 0, -20, -14, -8];
  var offset = offsets[phase];
  var cropX = phase < 3 ? 0 : 20;
  ctx.fillStyle = SPRITE_COLOR;
  for (var py = 0; py < 40; py++) {
    var runStart = -1;
    for (var px = 0; px < w; px++) {
      var gx = full ? px : px + cropX;
      var dx = gx - R + 0.5;
      var dy = py - R + 0.5;
      var inDisc = dx * dx + dy * dy <= R * R;
      var sdx = gx - R + 0.5 - offset;
      var inShadow = !full && (sdx * sdx + dy * dy <= R * R);
      var on = inDisc && !inShadow;
      if (on && runStart === -1) {
        runStart = px;
      } else if (!on && runStart !== -1) {
        ctx.fillRect(x + runStart, y + py, px - runStart, 1);
        runStart = -1;
      }
    }
    if (runStart !== -1) ctx.fillRect(x + runStart, y + py, w - runStart, 1);
  }
}

/** Paints the restart button: rounded outline with a circular arrow inside. */
function paintRestart(ctx, x, y) {
  var W = 36, H = 32;
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = SPRITE_COLOR;
  ctx.fillStyle = SPRITE_COLOR;
  ctx.lineWidth = 2;
  // Rounded outline.
  var r = 4;
  ctx.beginPath();
  ctx.moveTo(1 + r, 1);
  ctx.lineTo(W - 1 - r, 1);
  ctx.quadraticCurveTo(W - 1, 1, W - 1, 1 + r);
  ctx.lineTo(W - 1, H - 1 - r);
  ctx.quadraticCurveTo(W - 1, H - 1, W - 1 - r, H - 1);
  ctx.lineTo(1 + r, H - 1);
  ctx.quadraticCurveTo(1, H - 1, 1, H - 1 - r);
  ctx.lineTo(1, 1 + r);
  ctx.quadraticCurveTo(1, 1, 1 + r, 1);
  ctx.closePath();
  ctx.stroke();
  // Circular arrow, with a gap at the top right for the arrowhead.
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(W / 2, H / 2, 8, -Math.PI * 0.35, Math.PI * 1.5);
  ctx.stroke();
  // Arrowhead.
  ctx.beginPath();
  ctx.moveTo(W / 2 + 4, H / 2 - 11);
  ctx.lineTo(W / 2 + 13, H / 2 - 7);
  ctx.lineTo(W / 2 + 5, H / 2 - 1);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function buildAtlas() {
  // Lay everything out in rows; the atlas is generously sized because nothing
  // here is short on memory.
  atlas.width = 1024;
  atlas.height = 512;
  atlasCtx.clearRect(0, 0, atlas.width, atlas.height);

  var x = 0, y = 0, rowHeight = 0;

  function place(name, rows) {
    var w = artWidth(rows), h = rows.length;
    if (x + w > atlas.width) { x = 0; y += rowHeight + 2; rowHeight = 0; }
    paintArt(atlasCtx, rows, x, y);
    SPRITES[name] = { x: x, y: y, w: w, h: h };
    x += w + 2;
    if (h > rowHeight) rowHeight = h;
    return SPRITES[name];
  }

  function reserve(name, w, h) {
    if (x + w > atlas.width) { x = 0; y += rowHeight + 2; rowHeight = 0; }
    var rect = { x: x, y: y, w: w, h: h };
    SPRITES[name] = rect;
    x += w + 2;
    if (h > rowHeight) rowHeight = h;
    return rect;
  }

  place('TREX_STAND', ART.TREX_STAND);
  place('TREX_BLINK', ART.TREX_BLINK);
  place('TREX_RUN1', ART.TREX_RUN1);
  place('TREX_RUN2', ART.TREX_RUN2);
  place('TREX_CRASH', ART.TREX_CRASH);
  place('TREX_DUCK1', ART.TREX_DUCK1);
  place('TREX_DUCK2', ART.TREX_DUCK2);
  place('PTERODACTYL_1', ART.PTERODACTYL_1);
  place('PTERODACTYL_2', ART.PTERODACTYL_2);
  place('CLOUD', ART.CLOUD);

  // Cactus groups: 1, 2 and 3 wide, each composed from the shape variants so a
  // group reads as several different cacti rather than one stamped repeatedly.
  var smallVariants = [ART.CACTUS_SMALL_A, ART.CACTUS_SMALL_B, ART.CACTUS_SMALL_C];
  var largeVariants = [ART.CACTUS_LARGE_A, ART.CACTUS_LARGE_B, ART.CACTUS_LARGE_C];

  function placeGroup(name, variants, unitWidth, size, order) {
    var h = variants[0].length;
    var w = unitWidth * size;
    if (x + w > atlas.width) { x = 0; y += rowHeight + 2; rowHeight = 0; }
    for (var i = 0; i < size; i++) {
      paintArt(atlasCtx, variants[order[i]], x + i * unitWidth, y);
    }
    SPRITES[name] = { x: x, y: y, w: w, h: h };
    x += w + 2;
    if (h > rowHeight) rowHeight = h;
  }

  placeGroup('CACTUS_SMALL_1', smallVariants, 17, 1, [0]);
  placeGroup('CACTUS_SMALL_2', smallVariants, 17, 2, [1, 0]);
  placeGroup('CACTUS_SMALL_3', smallVariants, 17, 3, [0, 2, 1]);
  placeGroup('CACTUS_LARGE_1', largeVariants, 25, 1, [0]);
  placeGroup('CACTUS_LARGE_2', largeVariants, 25, 2, [1, 0]);
  placeGroup('CACTUS_LARGE_3', largeVariants, 25, 3, [0, 2, 1]);

  // Score glyphs.
  for (var g = 0; g < ART.GLYPHS.length; g++) {
    place('GLYPH_' + g, ART.GLYPHS[g]);
  }

  // Stars.
  for (var s = 0; s < ART.STARS.length; s++) {
    place('STAR_' + s, ART.STARS[s]);
  }

  // "GAME OVER" strip.
  var word = 'GAME OVER';
  var letterW = 12, letterGap = 10, letterH = 11;
  var textW = word.length * letterW + (word.length - 1) * letterGap;
  var textRect = reserve('TEXT_GAME_OVER', textW, letterH);
  for (var i = 0; i < word.length; i++) {
    paintArt(atlasCtx, ART.LETTERS[word.charAt(i)],
        textRect.x + i * (letterW + letterGap), textRect.y);
  }

  // Restart button.
  var restart = reserve('RESTART', 36, 32);
  paintRestart(atlasCtx, restart.x, restart.y);

  // Moon phases. Phase 3 is the full moon and is twice as wide.
  for (var p = 0; p < 7; p++) {
    var moon = reserve('MOON_' + p, p === 3 ? 40 : 20, 40);
    paintMoon(atlasCtx, moon.x, moon.y, p);
  }

  // Horizon lines: a mostly flat stretch and a bumpy one, as in the original.
  var h1 = reserve('HORIZON_0', 600, 12);
  paintHorizon(atlasCtx, h1.x, h1.y, 600, false, 20140923);
  var h2 = reserve('HORIZON_1', 600, 12);
  paintHorizon(atlasCtx, h2.x, h2.y, 600, true, 19960802);
}

// Handy when poking at the art from the console.
window.trexDebug = { atlas: atlas, sprites: SPRITES, art: ART };

/** Blits a named sprite at 1:1. */
function drawSprite(ctx, name, dx, dy) {
  var s = SPRITES[name];
  // The high score string carries a blank spacer glyph; skip anything unknown
  // rather than blowing up mid-frame.
  if (!s) return;
  ctx.drawImage(atlas, s.x, s.y, s.w, s.h, dx, dy, s.w, s.h);
}

/** Blits part of a named sprite - used by the horizon's scrolling segments. */
function drawSpritePart(ctx, name, sx, sy, sw, sh, dx, dy) {
  var s = SPRITES[name];
  if (sw <= 0 || sh <= 0) return;
  ctx.drawImage(atlas, s.x + sx, s.y + sy, sw, sh, dx, dy, sw, sh);
}

  CRASHED: 'CRASHED',
  DUCKING: 'DUCKING',
  JUMPING: 'JUMPING',
  RUNNING: 'RUNNING',
  WAITING: 'WAITING'
};

Trex.BLINK_TIMING = 7000;

Trex.animFrames = {
  WAITING: { frames: ['TREX_STAND', 'TREX_BLINK'], msPerFrame: 1000 / 3 },
  RUNNING: { frames: ['TREX_RUN1', 'TREX_RUN2'], msPerFrame: 1000 / 12 },
  CRASHED: { frames: ['TREX_CRASH'], msPerFrame: 1000 / 60 },
  JUMPING: { frames: ['TREX_STAND'], msPerFrame: 1000 / 60 },
  DUCKING: { frames: ['TREX_DUCK1', 'TREX_DUCK2'], msPerFrame: 1000 / 8 }
};

Trex.prototype = {
  init: function () {
    this.groundYPos = DEFAULT_HEIGHT - Trex.config.HEIGHT - CONFIG.BOTTOM_PAD;
    this.yPos = this.groundYPos;
    this.minJumpHeight = this.groundYPos - Trex.config.MIN_JUMP_HEIGHT;
    this.draw('TREX_STAND');
    this.update(0, Trex.status.WAITING);
  },

  update: function (deltaTime, opt_status) {
    this.timer += deltaTime;

    if (opt_status) {
      this.status = opt_status;
      this.currentFrame = 0;
      this.msPerFrame = Trex.animFrames[opt_status].msPerFrame;
      this.currentAnimFrames = Trex.animFrames[opt_status].frames;

      if (opt_status === Trex.status.WAITING) {
        this.animStartTime = getTimeStamp();
        this.setBlinkDelay();
      }
    }

    // The intro slide-in: walk the dino out to its start position.
    if (this.playingIntro && this.xPos < Trex.config.START_X_POS) {
      this.xPos += Math.round((Trex.config.START_X_POS / Trex.config.INTRO_DURATION) * deltaTime);
    }

    if (this.status === Trex.status.WAITING) {
      this.blink(getTimeStamp());
    } else {
      this.draw(this.currentAnimFrames[this.currentFrame]);
    }

    if (this.timer >= this.msPerFrame) {
      this.currentFrame = this.currentFrame === this.currentAnimFrames.length - 1 ?
          0 : this.currentFrame + 1;
      this.timer = 0;
    }

    // Standing up out of a duck after a crash needs a nudge, same as upstream.
    if (this.speedDrop && this.yPos === this.groundYPos) {
      this.speedDrop = false;
      this.setDuck(true);
    }
  },

  draw: function (spriteName) {
    // Crashing out of a duck stands the dino back up, which needs a 1px nudge.
    var x = this.xPos;
    if (this.ducking && this.status === Trex.status.CRASHED) x++;
    drawSprite(this.ctx, spriteName, x, this.yPos);
  },

  setBlinkDelay: function () {
    this.blinkDelay = Math.ceil(Math.random() * Trex.BLINK_TIMING);
  },

  blink: function (time) {
    var deltaTime = time - this.animStartTime;
    if (deltaTime >= this.blinkDelay) {
      // Hold the shut eye for one animation frame, then go back to waiting on
      // a fresh random delay.
      this.draw(this.currentAnimFrames[1]);
      if (deltaTime >= this.blinkDelay + this.msPerFrame) {
        this.setBlinkDelay();
        this.animStartTime = time;
        this.blinkCount++;
      }
    } else {
      this.draw(this.currentAnimFrames[0]);
    }
  },

  startJump: function (speed) {
    if (!this.jumping) {
      this.update(0, Trex.status.JUMPING);
      this.jumpVelocity = Trex.config.INITIAL_JUMP_VELOCITY - (speed / 10);
      this.jumping = true;
      this.reachedMinHeight = false;
      this.speedDrop = false;
    }
  },

  endJump: function () {
    if (this.reachedMinHeight && this.jumpVelocity < Trex.config.DROP_VELOCITY) {
      this.jumpVelocity = Trex.config.DROP_VELOCITY;
    }
  },

  updateJump: function (deltaTime) {
    var msPerFrame = Trex.animFrames[this.status].msPerFrame;
    var framesElapsed = deltaTime / msPerFrame;

    if (this.speedDrop) {
      this.yPos += Math.round(this.jumpVelocity * Trex.config.SPEED_DROP_COEFFICIENT * framesElapsed);
    } else {
      this.yPos += Math.round(this.jumpVelocity * framesElapsed);
    }

    this.jumpVelocity += Trex.config.GRAVITY * framesElapsed;

    if (this.yPos < this.minJumpHeight || this.speedDrop) {
      this.reachedMinHeight = true;
    }

    if (this.yPos < Trex.config.MAX_JUMP_HEIGHT || this.speedDrop) {
      this.endJump();
    }

    if (this.yPos > this.groundYPos) {
      this.reset();
      this.jumpCount++;
    }

    this.update(deltaTime);
  },

  setSpeedDrop: function () {
    this.speedDrop = true;
    this.jumpVelocity = 1;
  },

  setDuck: function (isDucking) {
    if (isDucking && this.status !== Trex.status.DUCKING) {
      this.update(0, Trex.status.DUCKING);
      this.ducking = true;
    } else if (this.status === Trex.status.DUCKING) {
      this.update(0, Trex.status.RUNNING);
      this.ducking = false;
    }
  },

  reset: function () {
    this.yPos = this.groundYPos;
    this.jumpVelocity = 0;
    this.jumping = false;
    this.ducking = false;
    this.update(0, Trex.status.RUNNING);
    this.midair = false;
    this.speedDrop = false;
    this.jumpCount = 0;
  }
};

//==============================================================================
// OBSTACLE
//==============================================================================

function Obstacle(ctx, type, dimensions, gapCoefficient, speed, opt_xOffset) {
  this.ctx = ctx;
  this.typeConfig = type;
  this.gapCoefficient = gapCoefficient;
  this.size = getRandomNum(1, CONFIG.MAX_OBSTACLE_LENGTH);
  this.dimensions = dimensions;
  this.remove = false;
  this.xPos = dimensions.WIDTH + (opt_xOffset || 0);
  this.yPos = 0;
  this.width = 0;
  this.collisionBoxes = [];
  this.gap = 0;
  this.speedOffset = 0;

  // Animation frames, for the pterodactyl.
  this.currentFrame = 0;
  this.timer = 0;

  this.init(speed);
}

Obstacle.MAX_GAP_COEFFICIENT = 1.5;
Obstacle.MAX_OBSTACLE_LENGTH = 3;

Obstacle.prototype = {
  init: function (speed) {
    this.cloneCollisionBoxes();

    // Multi-width obstacles only show up once the game is quick enough.
    if (this.size > 1 && this.typeConfig.multipleSpeed > speed) {
      this.size = 1;
    }

    this.width = this.typeConfig.width * this.size;

    if (Array.isArray(this.typeConfig.yPos)) {
      var yPosConfig = IS_MOBILE ? this.typeConfig.yPosMobile : this.typeConfig.yPos;
      this.yPos = yPosConfig[getRandomNum(0, yPosConfig.length - 1)];
    } else {
      this.yPos = this.typeConfig.yPos;
    }

    this.draw();

    // Widen the middle collision box to cover a multi-cactus group.
    if (this.size > 1) {
      this.collisionBoxes[1].width = this.width - this.collisionBoxes[0].width -
          this.collisionBoxes[2].width;
      this.collisionBoxes[2].x = this.width - this.collisionBoxes[2].width;
    }

    // Pterodactyls drift a little faster or slower than the ground.
    if (this.typeConfig.speedOffset) {
      this.speedOffset = Math.random() > 0.5 ?
          this.typeConfig.speedOffset : -this.typeConfig.speedOffset;
    }

    this.gap = this.getGap(this.gapCoefficient, speed);
  },

  draw: function () {
    var name;
    if (this.typeConfig.numFrames) {
      name = this.typeConfig.sprite + (this.currentFrame + 1);
    } else {
      name = this.typeConfig.sprite + this.size;
    }
    drawSprite(this.ctx, name, this.xPos, this.yPos);
  },

  update: function (deltaTime, speed) {
    if (!this.remove) {
      if (this.typeConfig.speedOffset) {
        speed += this.speedOffset;
      }
      this.xPos -= Math.floor((speed * FPS / 1000) * deltaTime);

      if (this.typeConfig.numFrames) {
        this.timer += deltaTime;
        if (this.timer >= this.typeConfig.frameRate) {
          this.currentFrame = this.currentFrame === this.typeConfig.numFrames - 1 ?
              0 : this.currentFrame + 1;
          this.timer = 0;
        }
      }
      this.draw();

      if (!this.isVisible()) {
        this.remove = true;
      }
    }
  },

  getGap: function (gapCoefficient, speed) {
    var minGap = Math.round(this.width * speed + this.typeConfig.minGap * gapCoefficient);
    var maxGap = Math.round(minGap * Obstacle.MAX_GAP_COEFFICIENT);
    return getRandomNum(minGap, maxGap);
  },

  isVisible: function () {
    return this.xPos + this.width > 0;
  },

  cloneCollisionBoxes: function () {
    var collisionBoxes = this.typeConfig.collisionBoxes;
    for (var i = collisionBoxes.length - 1; i >= 0; i--) {
      this.collisionBoxes[i] = new CollisionBox(collisionBoxes[i].x,
          collisionBoxes[i].y, collisionBoxes[i].width, collisionBoxes[i].height);
    }
  }
};

//==============================================================================
// COLLISION
//==============================================================================

function boxCompare(tRexBox, obstacleBox) {
  return tRexBox.x < obstacleBox.x + obstacleBox.width &&
      tRexBox.x + tRexBox.width > obstacleBox.x &&
      tRexBox.y < obstacleBox.y + obstacleBox.height &&
      tRexBox.height + tRexBox.y > obstacleBox.y;
}

function createAdjustedCollisionBox(box, adjustment) {
  return new CollisionBox(
      box.x + adjustment.x,
      box.y + adjustment.y,
      box.width,
      box.height);
}

function checkForCollision(obstacle, tRex) {
  // The 1px inset accounts for the border baked into each sprite.
  var tRexBox = new CollisionBox(
      tRex.xPos + 1,
      tRex.yPos + 1,
      Trex.config.WIDTH - 2,
      Trex.config.HEIGHT - 2);

  var obstacleBox = new CollisionBox(
      obstacle.xPos + 1,
      obstacle.yPos + 1,
      obstacle.typeConfig.width * obstacle.size - 2,
      obstacle.typeConfig.height - 2);

  // Cheap test first; only look at the detailed boxes if the outlines overlap.
  if (boxCompare(tRexBox, obstacleBox)) {
    var collisionBoxes = obstacle.collisionBoxes;
    var tRexCollisionBoxes = tRex.ducking ?
        Trex.collisionBoxes.DUCKING : Trex.collisionBoxes.RUNNING;

    for (var t = 0; t < tRexCollisionBoxes.length; t++) {
      for (var i = 0; i < collisionBoxes.length; i++) {
        var adjTrexBox = createAdjustedCollisionBox(tRexCollisionBoxes[t], tRexBox);
        var adjObstacleBox = createAdjustedCollisionBox(collisionBoxes[i], obstacleBox);
        if (boxCompare(adjTrexBox, adjObstacleBox)) {
          return [adjTrexBox, adjObstacleBox];
        }
      }
    }
  }
  return false;
}

//==============================================================================
// CLOUD
//==============================================================================

function Cloud(ctx, containerWidth) {
  this.ctx = ctx;
  this.containerWidth = containerWidth;
  this.xPos = containerWidth;
  this.yPos = 0;
  this.remove = false;
  this.cloudGap = getRandomNum(Cloud.config.MIN_CLOUD_GAP, Cloud.config.MAX_CLOUD_GAP);
  this.init();
}

Cloud.config = {
  HEIGHT: 14,
  MAX_CLOUD_GAP: 400,
  MAX_SKY_LEVEL: 30,
  MIN_CLOUD_GAP: 100,
  MIN_SKY_LEVEL: 71,
  WIDTH: 46
};

Cloud.prototype = {
  init: function () {
    this.yPos = getRandomNum(Cloud.config.MAX_SKY_LEVEL, Cloud.config.MIN_SKY_LEVEL);
    this.draw();
  },

  draw: function () {
    drawSprite(this.ctx, 'CLOUD', this.xPos, this.yPos);
  },

  update: function (speed) {
    if (!this.remove) {
      this.xPos -= Math.ceil(speed);
      this.draw();
      if (!this.isVisible()) {
        this.remove = true;
      }
    }
  },

  isVisible: function () {
    return this.xPos + Cloud.config.WIDTH > 0;
  }
};

//==============================================================================
// NIGHT MODE
//==============================================================================

function NightMode(ctx, containerWidth) {
  this.ctx = ctx;
  this.containerWidth = containerWidth;
  this.xPos = containerWidth - 50;
  this.yPos = 30;
  this.currentPhase = 0;
  this.opacity = 0;
  this.stars = [];
  this.drawStars = false;
  this.placeStars();
}

NightMode.config = {
  FADE_SPEED: 0.035,
  HEIGHT: 40,
  MOON_SPEED: 0.25,
  NUM_STARS: 2,
  STAR_SIZE: 9,
  STAR_SPEED: 0.3,
  STAR_MAX_Y: 70,
  WIDTH: 20
};

NightMode.prototype = {
  update: function (activated) {
    // Roll to the next phase each time night falls.
    if (activated && this.opacity === 0) {
      this.currentPhase++;
      if (this.currentPhase >= 7) {
        this.currentPhase = 0;
      }
    }

    if (activated && (this.opacity < 1 || this.opacity === 0)) {
      this.opacity += NightMode.config.FADE_SPEED;
    } else if (this.opacity > 0) {
      this.opacity -= NightMode.config.FADE_SPEED;
    }

    if (this.opacity > 0) {
      this.xPos = this.updateXPos(this.xPos, NightMode.config.MOON_SPEED);

      if (this.drawStars) {
        for (var i = 0; i < NightMode.config.NUM_STARS; i++) {
          this.stars[i].x = this.updateXPos(this.stars[i].x, NightMode.config.STAR_SPEED);
        }
      }
      this.draw();
    } else {
      this.opacity = 0;
      this.placeStars();
    }
    this.drawStars = true;
  },

  updateXPos: function (currentPos, speed) {
    if (currentPos < -NightMode.config.WIDTH) {
      currentPos = this.containerWidth;
    } else {
      currentPos -= speed;
    }
    return currentPos;
  },

  draw: function () {
    this.ctx.save();
    this.ctx.globalAlpha = this.opacity;

    if (this.drawStars) {
      for (var i = 0; i < NightMode.config.NUM_STARS; i++) {
        drawSprite(this.ctx, 'STAR_' + this.stars[i].sprite,
            Math.round(this.stars[i].x), this.stars[i].y);
      }
    }

    drawSprite(this.ctx, 'MOON_' + this.currentPhase, Math.round(this.xPos), this.yPos);
    this.ctx.restore();
  },

  placeStars: function () {
    var segmentSize = Math.round(this.containerWidth / NightMode.config.NUM_STARS);
    this.stars = [];
    for (var i = 0; i < NightMode.config.NUM_STARS; i++) {
      this.stars[i] = {
        x: getRandomNum(segmentSize * i, segmentSize * (i + 1)),
        y: getRandomNum(0, NightMode.config.STAR_MAX_Y),
        sprite: getRandomNum(0, ART.STARS.length - 1)
      };
    }
  },

  reset: function () {
    this.currentPhase = 0;
    this.opacity = 0;
    this.update(false);
  }
};

//==============================================================================
// HORIZON LINE
//==============================================================================

function HorizonLine(ctx) {
  this.ctx = ctx;
  this.dimensions = { WIDTH: 600, HEIGHT: 12, YPOS: 138 };
  this.sourceXPos = [0, 0];
  this.sourceTypes = ['HORIZON_0', 'HORIZON_1'];
  this.xPos = [];
  this.yPos = 0;
  this.bumpThreshold = 0.5;
  this.types = [0, 0];
  this.setSourceDimensions();
  this.draw();
}

HorizonLine.prototype = {
  setSourceDimensions: function () {
    this.xPos = [0, this.dimensions.WIDTH];
    this.yPos = this.dimensions.YPOS;
    this.types = [0, this.getRandomType()];
  },

  getRandomType: function () {
    return Math.random() > this.bumpThreshold ? 1 : 0;
  },

  draw: function () {
    drawSprite(this.ctx, this.sourceTypes[this.types[0]], this.xPos[0], this.yPos);
    drawSprite(this.ctx, this.sourceTypes[this.types[1]], this.xPos[1], this.yPos);
  },

  updateXPos: function (pos, increment) {
    var line1 = pos;
    var line2 = pos === 0 ? 1 : 0;

    this.xPos[line1] -= increment;
    this.xPos[line2] = this.xPos[line1] + this.dimensions.WIDTH;

    if (this.xPos[line1] <= -this.dimensions.WIDTH) {
      this.xPos[line1] += this.dimensions.WIDTH * 2;
      this.xPos[line2] = this.xPos[line1] - this.dimensions.WIDTH;
      this.types[line1] = this.getRandomType();
    }
  },

  update: function (deltaTime, speed) {
    var increment = Math.floor(speed * (FPS / 1000) * deltaTime);
    if (this.xPos[0] <= 0) {
      this.updateXPos(0, increment);
    } else {
      this.updateXPos(1, increment);
    }
    this.draw();
  },

  reset: function () {
    this.xPos[0] = 0;
    this.xPos[1] = this.dimensions.WIDTH;
  }
};

//==============================================================================
// HORIZON - owns the ground, clouds, obstacles and night mode
//==============================================================================

function Horizon(ctx, dimensions, gapCoefficient) {
  this.ctx = ctx;
  this.config = { BG_CLOUD_SPEED: 0.2, BUMPY_THRESHOLD: 0.3, CLOUD_FREQUENCY: 0.5, HORIZON_HEIGHT: 16, MAX_CLOUDS: 6 };
  this.dimensions = dimensions;
  this.gapCoefficient = gapCoefficient;
  this.obstacles = [];
  this.obstacleHistory = [];
  this.horizonOffsets = [0, 0];
  this.cloudFrequency = this.config.CLOUD_FREQUENCY;
  this.clouds = [];
  this.cloudSpeed = this.config.BG_CLOUD_SPEED;
  this.horizonLine = null;
  this.nightMode = null;
  this.init();
}

Horizon.prototype = {
  init: function () {
    this.addCloud();
    this.horizonLine = new HorizonLine(this.ctx);
    this.nightMode = new NightMode(this.ctx, this.dimensions.WIDTH);
  },

  update: function (deltaTime, currentSpeed, updateObstacles, showNightMode) {
    this.horizonLine.update(deltaTime, currentSpeed);
    this.nightMode.update(showNightMode);
    this.updateClouds(deltaTime, currentSpeed);
    if (updateObstacles) {
      this.updateObstacles(deltaTime, currentSpeed);
    }
  },

  updateClouds: function (deltaTime, speed) {
    var cloudSpeed = this.cloudSpeed / 1000 * deltaTime * speed;
    var numClouds = this.clouds.length;

    if (numClouds) {
      for (var i = numClouds - 1; i >= 0; i--) {
        this.clouds[i].update(cloudSpeed);
      }

      var lastCloud = this.clouds[numClouds - 1];

      if (numClouds < this.config.MAX_CLOUDS &&
          (this.dimensions.WIDTH - lastCloud.xPos) > lastCloud.cloudGap &&
          this.cloudFrequency > Math.random()) {
        this.addCloud();
      }

      this.clouds = this.clouds.filter(function (obj) { return !obj.remove; });
    } else {
      this.addCloud();
    }
  },

  updateObstacles: function (deltaTime, currentSpeed) {
    var updatedObstacles = this.obstacles.slice(0);

    for (var i = 0; i < this.obstacles.length; i++) {
      var obstacle = this.obstacles[i];
      obstacle.update(deltaTime, currentSpeed);
      if (obstacle.remove) {
        updatedObstacles.shift();
      }
    }
    this.obstacles = updatedObstacles;

    if (this.obstacles.length > 0) {
      var lastObstacle = this.obstacles[this.obstacles.length - 1];
      if (lastObstacle && !lastObstacle.followingObstacleCreated &&
          lastObstacle.isVisible() &&
          (lastObstacle.xPos + lastObstacle.width + lastObstacle.gap) < this.dimensions.WIDTH) {
        this.addNewObstacle(currentSpeed);
        lastObstacle.followingObstacleCreated = true;
      }
    } else {
      this.addNewObstacle(currentSpeed);
    }
  },

  addNewObstacle: function (currentSpeed) {
    var obstacleTypeIndex = getRandomNum(0, OBSTACLE_TYPES.length - 1);
    var obstacleType = OBSTACLE_TYPES[obstacleTypeIndex];

    // Don't stack up too many of the same thing, and respect the speed gate.
    if (this.duplicateObstacleCheck(obstacleType.type) || currentSpeed < obstacleType.minSpeed) {
      this.addNewObstacle(currentSpeed);
    } else {
      this.obstacles.push(new Obstacle(this.ctx, obstacleType, this.dimensions,
          this.gapCoefficient, currentSpeed, obstacleType.width));

      this.obstacleHistory.unshift(obstacleType.type);
      if (this.obstacleHistory.length > 1) {
        this.obstacleHistory.splice(CONFIG.MAX_OBSTACLE_DUPLICATION);
      }
    }
  },

  duplicateObstacleCheck: function (nextObstacleType) {
    var duplicateCount = 0;
    for (var i = 0; i < this.obstacleHistory.length; i++) {
      duplicateCount = this.obstacleHistory[i] === nextObstacleType ? duplicateCount + 1 : 0;
    }
    return duplicateCount >= CONFIG.MAX_OBSTACLE_DUPLICATION;
  },

  reset: function () {
    this.obstacles = [];
    this.horizonLine.reset();
    this.nightMode.reset();
  },

  addCloud: function () {
    this.clouds.push(new Cloud(this.ctx, this.dimensions.WIDTH));
  }
};

//==============================================================================
// DISTANCE METER
//==============================================================================

function DistanceMeter(ctx, canvasWidth) {
  this.ctx = ctx;
  this.x = 0;
  this.y = 5;
  this.currentDistance = 0;
  this.maxScore = 0;
  this.highScore = 0;
  this.digits = [];
  this.achievement = false;
  this.defaultString = '';
  this.flashTimer = 0;
  this.flashIterations = 0;
  this.invertTrigger = false;
  this.maxScoreUnits = DistanceMeter.config.MAX_DISTANCE_UNITS;
  this.init(canvasWidth);
}

DistanceMeter.dimensions = { WIDTH: 10, HEIGHT: 13, DEST_WIDTH: 11 };

DistanceMeter.config = {
  MAX_DISTANCE_UNITS: 5,
  ACHIEVEMENT_DISTANCE: 100,
  COEFFICIENT: 0.025,
  FLASH_DURATION: 1000 / 4,
  FLASH_ITERATIONS: 3
};

DistanceMeter.prototype = {
  init: function (width) {
    var maxDistanceStr = '';
    this.calcXPos(width);
    this.maxScore = this.maxScoreUnits;
    for (var i = 0; i < this.maxScoreUnits; i++) {
      this.draw(i, 0);
      this.defaultString += '0';
      maxDistanceStr += '9';
    }
    this.maxScore = parseInt(maxDistanceStr, 10);
  },

  calcXPos: function (canvasWidth) {
    this.x = canvasWidth - (DistanceMeter.dimensions.DEST_WIDTH * (this.maxScoreUnits + 1));
  },

  draw: function (digitPos, value, opt_highScore) {
    var glyph = 'GLYPH_' + value;

    this.ctx.save();
    if (opt_highScore) {
      // High score sits to the left of the current score, dimmed.
      var highScoreX = this.x - (this.maxScoreUnits * 2) * DistanceMeter.dimensions.DEST_WIDTH;
      this.ctx.translate(highScoreX, this.y);
      this.ctx.globalAlpha = 0.8;
    } else {
      this.ctx.translate(this.x, this.y);
    }

    drawSprite(this.ctx, glyph,
        digitPos * DistanceMeter.dimensions.DEST_WIDTH, 0);
    this.ctx.restore();
  },

  getActualDistance: function (distance) {
    return distance ? Math.round(distance * DistanceMeter.config.COEFFICIENT) : 0;
  },

  update: function (deltaTime, distance) {
    var paint = true;
    var playSound = false;

    if (!this.achievement) {
      distance = this.getActualDistance(distance);
      // Wrap around rather than overflow the digit count.
      if (distance > this.maxScore && this.maxScoreUnits === DistanceMeter.config.MAX_DISTANCE_UNITS) {
        this.maxScoreUnits++;
        this.maxScore = parseInt(this.maxScore + '9', 10);
      } else {
        this.distance = 0;
      }

      if (distance > 0) {
        // Every 100 points, flash the score and play the chime.
        if (distance % DistanceMeter.config.ACHIEVEMENT_DISTANCE === 0) {
          this.achievement = true;
          this.flashTimer = 0;
          playSound = true;
        }
        var distanceStr = (this.defaultString + distance).substr(-this.maxScoreUnits);
        this.digits = distanceStr.split('');
      } else {
        this.digits = this.defaultString.split('');
      }
    } else {
      // Flashing: skip painting on alternate quarter-seconds.
      if (this.flashIterations <= DistanceMeter.config.FLASH_ITERATIONS) {
        this.flashTimer += deltaTime;
        if (this.flashTimer < DistanceMeter.config.FLASH_DURATION) {
          paint = false;
        } else if (this.flashTimer > DistanceMeter.config.FLASH_DURATION * 2) {
          this.flashTimer = 0;
          this.flashIterations++;
        }
      } else {
        this.achievement = false;
        this.flashIterations = 0;
        this.flashTimer = 0;
      }
    }

    if (paint) {
      for (var i = this.digits.length - 1; i >= 0; i--) {
        this.draw(i, parseInt(this.digits[i], 10));
      }
    }

    this.drawHighScore();
    return playSound;
  },

  drawHighScore: function () {
    if (!this.highScore || this.highScore.length === 0) return;
    this.ctx.save();
    this.ctx.globalAlpha = 0.8;
    for (var i = this.highScore.length - 1; i >= 0; i--) {
      this.draw(i, parseInt(this.highScore[i], 10), true);
    }
    this.ctx.restore();
  },

  setHighScore: function (distance) {
    distance = this.getActualDistance(distance);
    var highScoreStr = (this.defaultString + distance).substr(-this.maxScoreUnits);
    this.highScore = ['10', '11', ''].concat(highScoreStr.split(''));
  },

  reset: function () {
    this.update(0, 0);
    this.achievement = false;
  }
};

//==============================================================================
// GAME OVER PANEL
//==============================================================================

function GameOverPanel(ctx, dimensions) {
  this.ctx = ctx;
  this.canvasDimensions = dimensions;
  this.draw();
}

GameOverPanel.dimensions = {
  TEXT_X: 0,
  TEXT_Y: 13,
  RESTART_WIDTH: 36,
  RESTART_HEIGHT: 32
};

GameOverPanel.prototype = {
  updateDimensions: function (width, opt_height) {
    this.canvasDimensions.WIDTH = width;
    if (opt_height) this.canvasDimensions.HEIGHT = opt_height;
  },

  draw: function () {
    var text = SPRITES.TEXT_GAME_OVER;
    var centerX = this.canvasDimensions.WIDTH / 2;

    var textX = Math.round(centerX - (text.w / 2));
    var textY = Math.round((this.canvasDimensions.HEIGHT - 25) / 3);
    drawSprite(this.ctx, 'TEXT_GAME_OVER', textX, textY);

    var restartX = Math.round(centerX - GameOverPanel.dimensions.RESTART_WIDTH / 2);
    var restartY = textY + 24;
    drawSprite(this.ctx, 'RESTART', restartX, restartY);

    this.restartBounds = {
      x: restartX,
      y: restartY,
      width: GameOverPanel.dimensions.RESTART_WIDTH,
      height: GameOverPanel.dimensions.RESTART_HEIGHT
    };
  }
};

//==============================================================================
// SOUND - synthesised, so there are no audio files to ship or load
//==============================================================================

var Sound = {
  ctx: null,
  muted: false,

  init: function () {
    if (this.ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
    } catch (e) {
      this.ctx = null;
    }
  },

  resume: function () {
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  },

  tone: function (freq, startOffset, duration, type, gainValue) {
    if (!this.ctx || this.muted) return;
    var t0 = this.ctx.currentTime + startOffset;
    var osc = this.ctx.createOscillator();
    var gain = this.ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(gainValue || 0.08, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  },

  press: function () {
    this.tone(1400, 0, 0.06, 'square', 0.05);
  },

  hit: function () {
    if (!this.ctx || this.muted) return;
    this.tone(220, 0, 0.12, 'square', 0.09);
    this.tone(150, 0.06, 0.22, 'square', 0.08);
  },

  score: function () {
    this.tone(1000, 0, 0.09, 'square', 0.06);
    this.tone(1500, 0.09, 0.14, 'square', 0.06);
  }
};

//==============================================================================
// RUNNER - the game itself
//==============================================================================

function Runner(canvas) {
  this.canvas = canvas;
  this.ctx = canvas.getContext('2d');
  this.wrapper = document.getElementById('wrapper');
  this.page = document.getElementById('page');
  this.hint = document.getElementById('hint');

  this.dimensions = { WIDTH: DEFAULT_WIDTH, HEIGHT: DEFAULT_HEIGHT };
  this.config = CONFIG;

  this.tRex = null;
  this.horizon = null;
  this.distanceMeter = null;
  this.gameOverPanel = null;

  this.distanceRan = 0;
  this.highestScore = 0;
  this.time = 0;
  this.runningTime = 0;
  this.msPerFrame = 1000 / FPS;
  this.currentSpeed = this.config.SPEED;

  this.activated = false;
  this.playing = false;
  this.crashed = false;
  this.paused = false;
  this.updatePending = false;
  this.playingIntro = false;
  this.introStart = 0;
  this.raqId = 0;

  this.inverted = false;
  this.invertTimer = 0;
  this.invertTrigger = false;

  this.playCount = 0;

  // Touch bookkeeping, so a held finger keeps ducking or extends a jump.
  this.pointers = {};

  this.init();
}

// How long the opening reveal runs for. Trex.config.INTRO_DURATION matches it
// so the dino finishes walking out exactly as the strip finishes opening.
Runner.INTRO_DURATION = 400;

// Biggest the sprites are ever drawn. 2x matches the original's hi-dpi artwork.
Runner.MAX_SCALE = 2;

Runner.prototype = {
  init: function () {
    buildAtlas();

    this.adjustDimensions();
    this.setSpeed();

    this.horizon = new Horizon(this.ctx, this.dimensions, this.config.GAP_COEFFICIENT);
    this.distanceMeter = new DistanceMeter(this.ctx, this.dimensions.WIDTH);
    this.tRex = new Trex(this.ctx);

    this.loadHighScore();
    this.startListening();
    this.update();

    window.addEventListener('resize', this.debouncedResize.bind(this), false);
    window.addEventListener('orientationchange', this.debouncedResize.bind(this), false);
  },

  /**
   * Sizes the play area to the screen.
   *
   * The sprites are never drawn below their native size - on a narrow screen
   * the *world* gets narrower instead, which is how the original handles
   * phones. Less of the track is visible, so setSpeed() slows the game by the
   * same proportion and you get the same reaction time.
   */
  adjustDimensions: function () {
    var availableWidth = Math.max(240, window.innerWidth - 16);
    var availableHeight = Math.max(100, window.innerHeight - 90);

    var scale = Math.min(availableWidth / DEFAULT_WIDTH, Runner.MAX_SCALE);
    if (scale < 1) scale = 1;
    // Never taller than the space available; a very short window is the one
    // case where shrinking below 1:1 beats clipping.
    scale = Math.min(scale, availableHeight / DEFAULT_HEIGHT);
    if (scale < 0.5) scale = 0.5;
    this.scale = scale;

    var worldWidth = Math.floor(availableWidth / scale);
    if (worldWidth > DEFAULT_WIDTH) worldWidth = DEFAULT_WIDTH;
    if (worldWidth < 240) worldWidth = 240;
    this.dimensions.WIDTH = worldWidth;

    var cssWidth = Math.round(worldWidth * scale);
    var cssHeight = Math.round(DEFAULT_HEIGHT * scale);

    var dpr = window.devicePixelRatio || 1;
    var backingRatio = scale * dpr;

    this.canvas.width = Math.round(worldWidth * backingRatio);
    this.canvas.height = Math.round(DEFAULT_HEIGHT * backingRatio);
    this.canvas.style.width = cssWidth + 'px';
    this.canvas.style.height = cssHeight + 'px';

    this.ctx.setTransform(backingRatio, 0, 0, backingRatio, 0, 0);
    this.ctx.imageSmoothingEnabled = false;
    this.ctx.webkitImageSmoothingEnabled = false;
    this.ctx.mozImageSmoothingEnabled = false;
    this.ctx.msImageSmoothingEnabled = false;

    this.wrapper.style.width = cssWidth + 'px';
    this.wrapper.style.height = cssHeight + 'px';

    // Horizon and the game-over panel share this.dimensions, so they follow
    // along; these two keep their own copy of the width.
    if (this.distanceMeter) {
      this.distanceMeter.calcXPos(worldWidth);
    }
    if (this.horizon) {
      this.horizon.nightMode.containerWidth = worldWidth;
      this.horizon.nightMode.placeStars();
    }
    // Speed is not recomputed here on purpose: it is set from the world width
    // when a run starts, and a rotation mid-run shouldn't undo the accelerating
    // speed you've earned.
  },

  debouncedResize: function () {
    var self = this;
    clearTimeout(this.resizeTimer);
    this.resizeTimer = setTimeout(function () {
      self.adjustDimensions();
      // Redraw straight away so a rotation mid-crash doesn't leave a blank box.
      if (!self.playing) {
        self.clearCanvas();
        self.horizon.update(0, 0, false, self.inverted);
        self.tRex.update(0);
        if (self.crashed && self.gameOverPanel) {
          self.gameOverPanel.updateDimensions(self.dimensions.WIDTH);
          self.distanceMeter.update(0, Math.ceil(self.distanceRan));
          self.gameOverPanel.draw();
        }
      }
    }, 150);
  },

  setSpeed: function (opt_speed) {
    var speed = opt_speed || this.currentSpeed;
    // A narrower world shows less of the track ahead, so run proportionally
    // slower and the player gets the same amount of warning.
    if (this.dimensions.WIDTH < DEFAULT_WIDTH) {
      var narrowSpeed = speed * this.dimensions.WIDTH / DEFAULT_WIDTH *
          this.config.MOBILE_SPEED_COEFFICIENT;
      this.currentSpeed = narrowSpeed > speed ? speed : narrowSpeed;
    } else if (opt_speed) {
      this.currentSpeed = opt_speed;
    }
  },

  loadHighScore: function () {
    var stored = 0;
    try {
      stored = parseInt(window.localStorage.getItem('trex-highscore'), 10) || 0;
    } catch (e) {
      stored = 0;
    }
    this.highestScore = stored;
    if (stored > 0) {
      this.distanceMeter.setHighScore(stored);
    }
  },

  saveHighScore: function () {
    try {
      window.localStorage.setItem('trex-highscore', String(Math.ceil(this.highestScore)));
    } catch (e) {
      // Private mode or a file:// origin with storage disabled - not fatal.
    }
  },

  playIntro: function () {
    if (!this.activated && !this.crashed) {
      this.playingIntro = true;
      this.tRex.playingIntro = true;
      this.introStart = getTimeStamp();
      this.hint.classList.add('hidden');
      this.activated = true;

      // Widen the viewport from just-the-dino to the full strip, the way the
      // original opens up when you start running.
      var full = this.wrapper.style.width;
      this.wrapper.style.transition = 'none';
      this.wrapper.style.width = Math.round(Trex.config.WIDTH * this.scale) + 'px';
      this.wrapper.offsetWidth; // force the shrink to take before transitioning
      this.wrapper.style.transition = 'width ' + (Runner.INTRO_DURATION / 1000) + 's ease-out';
      this.wrapper.style.width = full;
    } else if (this.crashed) {
      this.restart();
    }
  },

  startGame: function () {
    this.runningTime = 0;
    this.playingIntro = false;
    this.tRex.playingIntro = false;
    // Land the dino exactly on its mark however the intro timing rounded out.
    this.tRex.xPos = Trex.config.START_X_POS;
    this.wrapper.style.transition = '';
    this.playCount++;
  },

  clearCanvas: function () {
    this.ctx.clearRect(0, 0, this.dimensions.WIDTH, this.dimensions.HEIGHT);
  },

  update: function () {
    this.updatePending = false;

    var now = getTimeStamp();
    var deltaTime = now - (this.time || now);
    this.time = now;

    // A backgrounded tab hands back a huge delta; clamp it so nothing teleports.
    if (deltaTime > 100) deltaTime = 100;

    if (this.playing) {
      this.clearCanvas();

      if (this.tRex.jumping) {
        this.tRex.updateJump(deltaTime);
      }

      this.runningTime += deltaTime;
      var hasObstacles = this.runningTime > this.config.CLEAR_TIME;

      // The first jump starts the intro slide.
      if (this.tRex.jumpCount === 1 && !this.playingIntro) {
        this.playIntro();
      }

      if (this.playingIntro) {
        // Ground stays put until the dino has walked out to its mark.
        this.horizon.update(0, this.currentSpeed, hasObstacles);
        if (getTimeStamp() - this.introStart > Runner.INTRO_DURATION) {
          this.startGame();
        }
      } else {
        deltaTime = !this.activated ? 0 : deltaTime;
        this.horizon.update(deltaTime, this.currentSpeed, hasObstacles, this.inverted);
      }

      var collision = hasObstacles && this.horizon.obstacles.length > 0 &&
          checkForCollision(this.horizon.obstacles[0], this.tRex);

      if (!collision) {
        this.distanceRan += this.currentSpeed * deltaTime / this.msPerFrame;
        if (this.currentSpeed < this.config.MAX_SPEED) {
          this.currentSpeed += this.config.ACCELERATION;
        }
      } else {
        this.gameOver();
      }

      var playAchievementSound = this.distanceMeter.update(deltaTime, Math.ceil(this.distanceRan));
      if (playAchievementSound) Sound.score();

      // Night mode toggles every INVERT_DISTANCE points and fades back out.
      if (this.invertTimer > this.config.INVERT_FADE_DURATION) {
        this.invertTimer = 0;
        this.invertTrigger = false;
        this.invert();
      } else if (this.invertTimer) {
        this.invertTimer += deltaTime;
      } else {
        var actualDistance = this.distanceMeter.getActualDistance(Math.ceil(this.distanceRan));
        if (actualDistance > 0) {
          this.invertTrigger = !(actualDistance % this.config.INVERT_DISTANCE);
          if (this.invertTrigger && this.invertTimer === 0) {
            this.invertTimer += deltaTime;
            this.invert();
          }
        }
      }
    }

    if (this.playing || (!this.activated && this.tRex.blinkCount < this.config.MAX_BLINK_COUNT)) {
      // On the idle screen the scene is repainted too, otherwise successive
      // blink frames stack on top of each other and the eye never reopens.
      if (!this.playing) {
        this.clearCanvas();
        this.horizon.update(0, 0, false, this.inverted);
        this.distanceMeter.update(0, Math.ceil(this.distanceRan));
      }
      this.tRex.update(deltaTime);
      this.scheduleNextUpdate();
    }
  },

  scheduleNextUpdate: function () {
    if (!this.updatePending) {
      this.updatePending = true;
      this.raqId = requestAnimationFrame(this.update.bind(this));
    }
  },

  invert: function (reset) {
    if (reset) {
      this.page.classList.remove('inverted');
      this.invertTimer = 0;
      this.inverted = false;
    } else {
      this.inverted = !this.inverted;
      this.page.classList.toggle('inverted', this.inverted);
    }
  },

  gameOver: function () {
    Sound.hit();

    this.stop();
    this.crashed = true;
    this.distanceMeter.achievement = false;

    // Repaint the frozen scene before stamping the crashed dino on top, so the
    // running frame's legs don't show through underneath it.
    this.clearCanvas();
    this.horizon.update(0, this.currentSpeed, true, this.inverted);
    this.distanceMeter.update(0, Math.ceil(this.distanceRan));

    this.tRex.update(100, Trex.status.CRASHED);

    if (!this.gameOverPanel) {
      this.gameOverPanel = new GameOverPanel(this.ctx, this.dimensions);
    } else {
      this.gameOverPanel.draw();
    }

    if (this.distanceRan > this.highestScore) {
      this.highestScore = Math.ceil(this.distanceRan);
      this.distanceMeter.setHighScore(this.highestScore);
      this.saveHighScore();
    }

    this.time = getTimeStamp();
  },

  stop: function () {
    this.playing = false;
    this.paused = true;
    cancelAnimationFrame(this.raqId);
    this.raqId = 0;
  },

  play: function () {
    if (!this.crashed) {
      this.playing = true;
      this.paused = false;
      this.tRex.update(0, Trex.status.RUNNING);
      this.time = getTimeStamp();
      this.update();
    }
  },

  restart: function () {
    if (!this.raqId) {
      this.playCount++;
      this.runningTime = 0;
      this.playing = true;
      this.paused = false;
      this.crashed = false;
      this.distanceRan = 0;
      this.setSpeed(this.config.SPEED);
      this.time = getTimeStamp();
      this.clearCanvas();
      this.distanceMeter.reset(this.highestScore);
      this.horizon.reset();
      this.tRex.reset();
      Sound.press();
      this.invert(true);
      this.update();
    }
  },

  //--------------------------------------------------------------------------
  // Input
  //--------------------------------------------------------------------------

  startListening: function () {
    document.addEventListener('keydown', this.onKeyDown.bind(this));
    document.addEventListener('keyup', this.onKeyUp.bind(this));

    // Pointer events cover mouse, touch and stylus in one path.
    this.canvas.addEventListener('pointerdown', this.onPointerDown.bind(this));
    this.canvas.addEventListener('pointerup', this.onPointerUp.bind(this));
    this.canvas.addEventListener('pointercancel', this.onPointerUp.bind(this));
    this.wrapper.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    // Tapping anywhere outside the canvas should still start/restart the game
    // on a phone, where the canvas is a small strip in the middle.
    document.addEventListener('pointerdown', this.onDocumentPointerDown.bind(this));

    // Pause when the tab or app goes away, so you don't come back to a crash.
    document.addEventListener('visibilitychange', this.onVisibilityChange.bind(this));
    window.addEventListener('blur', this.onVisibilityChange.bind(this));
    window.addEventListener('focus', this.onVisibilityChange.bind(this));

    var muteBtn = document.getElementById('mute');
    var self = this;
    muteBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      muteBtn.blur();
      self.toggleMute();
    });
  },

  toggleMute: function () {
    Sound.muted = !Sound.muted;
    document.getElementById('mute').innerHTML = Sound.muted ? '&#9834;' : '&#9835;';
    document.getElementById('mute').style.opacity = Sound.muted ? '0.25' : '0.55';
  },

  onVisibilityChange: function (e) {
    if (document.visibilityState === 'hidden' || e.type === 'blur') {
      this.onVisibilityHidden();
    } else if (!this.crashed && this.paused && this.activated) {
      this.tRex.reset();
      this.play();
    }
  },

  onVisibilityHidden: function () {
    if (this.playing) {
      this.stop();
    }
  },

  onKeyDown: function (e) {
    Sound.init();
    Sound.resume();

    if (e.target !== document.body && e.target !== document.documentElement &&
        e.target.tagName === 'BUTTON') {
      return;
    }

    if (e.keyCode === 77) { // M
      this.toggleMute();
      return;
    }

    if (this.crashed) {
      // Chrome ignores input for a moment after a crash so you can't
      // accidentally restart with the same keypress that killed you.
      if ((KEYCODES.JUMP[e.keyCode] || KEYCODES.RESTART[e.keyCode]) &&
          getTimeStamp() - this.time >= this.config.GAMEOVER_CLEAR_TIME) {
        e.preventDefault();
        this.restart();
      }
      return;
    }

    if (KEYCODES.JUMP[e.keyCode]) {
      e.preventDefault();
      if (!this.playing) {
        Sound.press();
        this.loadSounds();
        this.playing = true;
        this.update();
      }
      if (!this.tRex.jumping && !this.tRex.ducking) {
        Sound.press();
        this.tRex.startJump(this.currentSpeed);
      }
    } else if (this.playing && KEYCODES.DUCK[e.keyCode]) {
      e.preventDefault();
      if (this.tRex.jumping) {
        this.tRex.setSpeedDrop();
      } else if (!this.tRex.jumping && !this.tRex.ducking) {
        this.tRex.setDuck(true);
      }
    }
  },

  onKeyUp: function (e) {
    var isjumpKey = KEYCODES.JUMP[e.keyCode];

    if (this.isRunning() && isjumpKey) {
      this.tRex.endJump();
    } else if (KEYCODES.DUCK[e.keyCode]) {
      this.tRex.speedDrop = false;
      this.tRex.setDuck(false);
    } else if (this.crashed) {
      var deltaTime = getTimeStamp() - this.time;
      if (KEYCODES.RESTART[e.keyCode] ||
          (deltaTime >= this.config.GAMEOVER_CLEAR_TIME && KEYCODES.JUMP[e.keyCode])) {
        this.restart();
      }
    }
  },

  loadSounds: function () {
    Sound.init();
    Sound.resume();
  },

  /** Canvas coordinates for a pointer event, undoing the display scale. */
  canvasPoint: function (e) {
    var rect = this.canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) / (rect.width / this.dimensions.WIDTH),
      y: (e.clientY - rect.top) / (rect.height / DEFAULT_HEIGHT)
    };
  },

  onDocumentPointerDown: function (e) {
    // Presses that land on the canvas are handled by its own listener.
    if (e.target === this.canvas || e.target.id === 'mute') return;
    this.handlePress(null);
  },

  onPointerDown: function (e) {
    e.preventDefault();
    var point = this.canvasPoint(e);
    this.pointers[e.pointerId] = point;
    this.handlePress(point);
  },

  onPointerUp: function (e) {
    var point = this.pointers[e.pointerId];
    delete this.pointers[e.pointerId];

    if (this.isRunning()) {
      if (point && point.duck) {
        this.tRex.speedDrop = false;
        this.tRex.setDuck(false);
      } else {
        // Releasing early gives the short hop, exactly like letting go of space.
        this.tRex.endJump();
      }
    } else if (this.crashed && point) {
      var deltaTime = getTimeStamp() - this.time;
      var onButton = this.gameOverPanel && this.gameOverPanel.restartBounds &&
          point.x >= this.gameOverPanel.restartBounds.x - 12 &&
          point.x <= this.gameOverPanel.restartBounds.x + this.gameOverPanel.restartBounds.width + 12 &&
          point.y >= this.gameOverPanel.restartBounds.y - 12 &&
          point.y <= this.gameOverPanel.restartBounds.y + this.gameOverPanel.restartBounds.height + 12;
      if (deltaTime >= this.config.GAMEOVER_CLEAR_TIME || onButton) {
        this.restart();
      }
    }
  },

  /**
   * One press handler for every pointing device. A press on the lower part of
   * the play area ducks; anywhere else jumps.
   */
  handlePress: function (point) {
    Sound.init();
    Sound.resume();

    if (this.crashed) {
      if (getTimeStamp() - this.time >= this.config.GAMEOVER_CLEAR_TIME) {
        this.restart();
      }
      return;
    }

    var wantsDuck = !!point && point.y > 95 && this.playing;

    if (!this.playing) {
      Sound.press();
      this.loadSounds();
      this.playing = true;
      this.update();
      if (!this.tRex.jumping) {
        Sound.press();
        this.tRex.startJump(this.currentSpeed);
      }
      return;
    }

    if (wantsDuck) {
      if (point) point.duck = true;
      if (this.tRex.jumping) {
        this.tRex.setSpeedDrop();
      } else if (!this.tRex.ducking) {
        this.tRex.setDuck(true);
      }
    } else if (!this.tRex.jumping && !this.tRex.ducking) {
      Sound.press();
      this.tRex.startJump(this.currentSpeed);
    }
  },

  isRunning: function () {
    return !!this.raqId;
  }
};

//==============================================================================
// BOOT
//==============================================================================

function boot() {
  var canvas = document.getElementById('runner');
  window.runner = new Runner(canvas);

  // Swap the keyboard hint for a touch one on phones and tablets.
  if (IS_MOBILE) {
    document.getElementById('hint').innerHTML =
        '<b>Tap</b> to jump &nbsp;&middot;&nbsp; <b>hold low</b> on the strip to duck' +
        '<br><span style="opacity:.7">turn the phone sideways for a wider view</span>';
  }

  // The service worker is what keeps an installed copy playable offline. It
  // only exists on http(s); from a file:// path the page is already local.
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {
        // Not fatal - the game still runs, it just isn't installed.
      });
    });
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
</body>
</html>
