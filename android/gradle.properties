org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Signing for the release build. This keystore is committed on purpose and is
# NOT a secret: it exists so anyone can rebuild an APK that installs as an
# update over the released one. It guards nothing else.
TREX_STORE_FILE=../keystore/trex-throwaway.jks
TREX_STORE_PASSWORD=trexrunner
TREX_KEY_ALIAS=trex
TREX_KEY_PASSWORD=trexrunner
